# Render Blueprint for the API. In Render: New > Blueprint > pick this repository.
# Values marked "sync: false" are asked for in the dashboard and never stored in git.
#
# Written from Render's Blueprint format as I know it and not yet deployed:
# if the dashboard rejects a field, create the service by hand with the same settings.
services:
  - type: web
    name: enterprise-knowledge-rag-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Supabase "Session pooler" connection string
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEMO_API_TOKEN # copy the generated value into Vercel
        generateValue: true
      - key: ALLOWED_ORIGINS # your Vercel URL, e.g. https://your-project.vercel.app
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBED_PROVIDER
        value: local
      - key: EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      # The reranker measured best, but the API then peaks at about 709 MB, over the free
      # plan's 512 MB. Without it, about 426 MB. On a plan with 1 GB or more, set
      # RERANK_PROVIDER=local and RERANK_MODEL=Xenova/ms-marco-MiniLM-L-12-v2.
      - key: RERANK_PROVIDER
        value: none
      - key: CHUNK_SIZE
        value: "128"
      - key: CHUNK_OVERLAP
        value: "16"
      - key: CHUNKER
        value: sentence
      - key: SEARCH_MODE
        value: hybrid
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
