# USD prices used for the cost-per-query metric.
#
# Fill in the models you actually run, from the provider's own pricing page, and
# note the date. A model that is missing or null here makes cost show as
# "not configured" instead of a wrong number.
#
# The filled-in values below were read from third-party pricing trackers on
# 2026-11-11, not from the providers directly. Confirm before you publish a
# cost figure. Promotional prices expire.

llm:
  mock: { input_per_mtok: 0, output_per_mtok: 0 }
  gpt-6-luna: { input_per_mtok: 0.10, output_per_mtok: 0.50 } # unverified, see note above
  gpt-6.1-sol: { input_per_mtok: 2.00, output_per_mtok: 10.00 } # unverified, see note above
  claude-haiku-5-5: { input_per_mtok: null, output_per_mtok: null }
  claude-sonnet-5-5: { input_per_mtok: null, output_per_mtok: null }
  # Gemini: read from https://aistudio.google.com/docs/pricing on 2026-11-11 (paid tier, standard).
  gemini-3.8-flash: { input_per_mtok: 0.75, output_per_mtok: 3.75 } # introductory price through 2026-12-31, then 1.50 / 7.50
  gemini-3.5-flash-lite: { input_per_mtok: 0.30, output_per_mtok: 2.50 }
  gemini-3.1-flash-lite: { input_per_mtok: 0.25, output_per_mtok: 1.50 }
  gemini-2.5-flash-lite: { input_per_mtok: 0.10, output_per_mtok: 0.40 }

