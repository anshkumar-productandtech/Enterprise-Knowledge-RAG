# Builds the search index in your hosted database (Supabase) for the live demo.
# Run it from the Actions tab after adding the SUPABASE_DATABASE_URL secret
# (Supabase > Connect > Session pooler connection string).
name: deploy-index

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: Rebuild the table if it already exists
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Clone the handbook
        working-directory: backend
        run: bash scripts/fetch_handbook.sh
      - name: Load the serving config
        run: grep -v '^#' backend/config/serving.env | grep '=' >> "$GITHUB_ENV"
      - name: Embed and store
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          RECREATE: ${{ inputs.recreate }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Add the SUPABASE_DATABASE_URL repository secret first."; exit 1; fi
          ARGS="--yes"; [ "$RECREATE" = "true" ] && ARGS="$ARGS --recreate"
          python -m scripts.ingest $ARGS 2>&1 | grep -v -i "warning" | grep -v "://"
