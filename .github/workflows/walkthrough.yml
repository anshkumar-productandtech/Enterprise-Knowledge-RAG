# Records docs/walkthrough/walkthrough.mp4 from the real app: real handbook,
# real answers from the configured model. Needs the GOOGLE_API_KEY secret.
# Start it from the Actions tab, or by editing .github/triggers/walkthrough.
name: walkthrough

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/triggers/walkthrough"]

permissions:
  contents: write

concurrency:
  group: walkthrough
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # The hosted index when it exists (no rebuild needed); otherwise the local service database.
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/eka' }}
      DEMO_API_TOKEN: ci-recording-only
      RATE_LIMIT_PER_MINUTE: "60"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Load the serving config
        run: grep -v '^#' backend/config/serving.env | grep '=' >> "$GITHUB_ENV"
      - name: Clone the handbook and build the index
        working-directory: backend
        run: |
          bash scripts/fetch_handbook.sh
          python -m scripts.ingest --yes 2>&1 | grep -v -i "warning" | tail -20
      - name: Start the API
        working-directory: backend
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then echo "Add the GOOGLE_API_KEY repository secret first."; exit 1; fi
          nohup uvicorn eka.api:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
      - name: Build and start the web app
        working-directory: web
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3000 && break; sleep 2; done
      - name: Record
        working-directory: backend
        run: python -m scripts.record_walkthrough --url http://localhost:3000 --out ../docs/walkthrough
      - name: Measure API memory (Render's free plan allows 512 MB)
        if: always()
        run: |
          PID=$(pgrep -f "uvicorn eka.api" | head -1)
          RSS=$(grep VmHWM /proc/$PID/status | awk '{print $2}')
          echo "API peak memory after the recording: $((RSS / 1024)) MB (embedding model + reranker + app)" > ../ci-reports/api-memory.txt; cat ../ci-reports/api-memory.txt
        working-directory: backend
      - name: Measure API memory without the reranker
        if: always()
        working-directory: backend
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          RERANK_PROVIDER: none
        run: |
          nohup uvicorn eka.api:app --port 8001 > /tmp/api-norerank.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8001/health > /dev/null && break; sleep 2; done
          curl -s -N -X POST localhost:8001/chat -H "authorization: Bearer $DEMO_API_TOKEN" -H 'content-type: application/json' \
            -d '{"question":"How many paid sick days do I get?","role":"employee"}' > /dev/null
          PID=$(pgrep -f "uvicorn eka.api:app --port 8001" | head -1)
          RSS=$(grep VmHWM /proc/$PID/status | awk '{print $2}')
          echo "API peak memory without the reranker, after one question: $((RSS / 1024)) MB" | tee -a ../ci-reports/api-memory.txt
      - name: Convert to MP4
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -y -loglevel error -i docs/walkthrough/walkthrough.webm -c:v libx264 -preset veryfast -crf 24 \
            -pix_fmt yuv420p -movflags +faststart -an docs/walkthrough/walkthrough.mp4
          rm docs/walkthrough/walkthrough.webm
      - name: Save API errors (secrets stripped)
        if: always()
        run: |
          {
            echo "API log lines about failures, from the recording run"
            grep -n -A3 -E "chat failed|Error|Exception|Traceback|429|503" /tmp/api.log | grep -v -i "warning" | tail -80
          } | sed -E 's#(postgres(ql)?(\+[a-z0-9]+)?://)[^ @]+@#\1***@#g; s#(key=)[A-Za-z0-9_-]+#\1***#g; s#AIza[0-9A-Za-z_-]{20,}#***#g' \
            > ci-reports/walkthrough-api-errors.txt || true
          cat ci-reports/walkthrough-api-errors.txt
      - name: Commit the recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/walkthrough ci-reports
          git commit -m "Walkthrough recording" || exit 0
          git pull --rebase origin main
          git push
