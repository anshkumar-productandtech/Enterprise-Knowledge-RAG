# Runs the experiment table on the real handbook and commits the results.
#
# retrieval-only  needs no API key: open-source embeddings and reranker run on the runner's CPU.
# full            adds answers and judge scores; needs the GOOGLE_API_KEY repository secret.
#
# Start it from the Actions tab, or by editing .github/triggers/experiments.
name: experiments

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [retrieval-only, full]
        default: retrieval-only
      only:
        description: Experiment names, space-separated (blank = all)
        default: ""
      limit:
        description: Only the first N golden questions (blank = all 50)
        default: ""
      llm_model:
        description: Answer model for full mode
        default: ""
      judge_model:
        description: Judge model for full mode (blank = same as the answer model)
        default: ""
  push:
    branches: [main]
    paths: [".github/triggers/experiments"]

permissions:
  contents: write

concurrency:
  group: experiments
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eka
      EMBED_PROVIDER: local
      EMBED_MODEL: BAAI/bge-small-en-v1.5
      RERANK_PROVIDER: local
      RERANK_MODEL: Xenova/ms-marco-MiniLM-L-12-v2
      HAS_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
      IN_MODE: ${{ inputs.mode }}
      IN_ONLY: ${{ inputs.only }}
      IN_LIMIT: ${{ inputs.limit }}
      IN_LLM_MODEL: ${{ inputs.llm_model }}
      IN_JUDGE_MODEL: ${{ inputs.judge_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-eval.txt
      - run: pip install -r backend/requirements-eval.txt

      - name: Read run settings
        run: |
          get() { grep -E "^$1=" .github/triggers/experiments 2>/dev/null | head -1 | cut -d= -f2- || true; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$IN_MODE"; ONLY="$IN_ONLY"; LIMIT="$IN_LIMIT"; MODEL="$IN_LLM_MODEL"; JUDGE="$IN_JUDGE_MODEL"
          else
            MODE="$(get mode)"; ONLY="$(get only)"; LIMIT="$(get limit)"; MODEL="$(get llm_model)"; JUDGE="$(get judge_model)"
          fi
          RPM="$(get eval_rpm)"; WORKERS="$(get judge_workers)"
          ARGS="--ingest-missing"
          if [ "$MODE" = "full" ]; then
            if [ "$HAS_KEY" != "true" ]; then echo "full mode needs the GOOGLE_API_KEY repository secret"; exit 1; fi
            if [ -z "$MODEL" ]; then echo "full mode needs llm_model"; exit 1; fi
            { echo "LLM_PROVIDER=gemini"; echo "LLM_MODEL=$MODEL"; } >> "$GITHUB_ENV"
            [ -n "$JUDGE" ] && { echo "JUDGE_PROVIDER=gemini"; echo "JUDGE_MODEL=$JUDGE"; } >> "$GITHUB_ENV"
          else
            ARGS="$ARGS --retrieval-only"
            { echo "LLM_PROVIDER=mock"; echo "LLM_MODEL=mock"; } >> "$GITHUB_ENV"
          fi
          [ -n "$ONLY" ] && ARGS="$ARGS --only $ONLY"
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          [ -n "$RPM" ] && echo "EVAL_RPM=$RPM" >> "$GITHUB_ENV"
          [ -n "$WORKERS" ] && echo "JUDGE_WORKERS=$WORKERS" >> "$GITHUB_ENV"
          echo "RUN_ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "mode=$MODE args=$ARGS"

      - name: Clone the handbook and check the golden set
        working-directory: backend
        run: |
          bash scripts/fetch_handbook.sh
          python -m scripts.validate_golden_set

      - name: Run experiments
        working-directory: backend
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}  # only this step can read the key
        run: |
          mkdir -p ../ci-reports
          python -m evals.run_experiments $RUN_ARGS 2>&1 | grep -v -i "warning" | tee ../ci-reports/experiments-last-run.log
          exit "${PIPESTATUS[0]}"

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/evals/results ci-reports
          git commit -m "Experiment results" || exit 0
          git pull --rebase origin main
          git push
